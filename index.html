<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Greta’s Café Bets - Every coffee is a bet with every sip a chance to win</title>
  <link rel="icon" href="images/Greta-transparent.png" type="image/png">
  <link rel="apple-touch-icon" href="images/Greta-transparent.png">
  <style>
    body, html {
      margin: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #7b2d9f 0%, #e77c29 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      position: relative;
      background: linear-gradient(135deg, #4a148c 0%, #ff6d00 100%);
      border-radius: 24px;
      padding: 30px;
      width: 360px;
      text-align: center;
      color: #fff;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      margin-bottom: 40px;
    }

    .title { font-size: 2.2rem; margin: 0 0 8px; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .subtitle { font-size: 1rem; margin-bottom: 20px; opacity: 0.9; }

    .card-graphic {
      width: 100%;
      height: 180px;
      background: url() center/cover no-repeat;
      margin-bottom: 12px;
    }

    .logo {
      position: absolute;
      right: 20px;
      bottom: 12px;
      width: 36px;
      height: 36px;
      background: url() center/contain no-repeat;
    }

    .play-btn {
      position: relative;
      padding: 18px 48px;
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      background: #754760;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      transition: transform .15s ease;
      box-shadow: 0 0 12px rgba(255,255,255,.3), 0 0 30px rgba(117,71,96,.6);
      overflow: hidden;
      z-index: 2;
    }

    .play-btn:hover {
      box-shadow: 0 0 18px rgba(255,255,255,.5), 0 0 45px rgba(117,71,96,.9);
      transform: translateY(-2px);
    }

    @keyframes breathe {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.08); }
    }

    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 12px rgba(255,255,255,.3), 0 0 30px rgba(117,71,96,.6); }
      50%     { box-shadow: 0 0 24px rgba(255,255,255,.6), 0 0 60px rgba(117,71,96,1); }
    }

    .play-btn.breathe { animation: breathe 2.2s ease-in-out infinite; }
    .play-btn.glow    { animation: glowPulse 2.2s ease-in-out infinite; }

    .play-btn::after {
      content:"";
      position:absolute;
      top:50%; left:50%;
      width:0; height:0;
      background:rgba(255,255,255,.4);
      border-radius:50%;
      transform:translate(-50%,-50%);
      transition:width .4s,height .4s;
    }
    .play-btn.ripple::after {
      width:300px; height:300px; opacity:0;
    }

    /* Progress bar container (under button) */
    .progress-container {
      width: 240px;
      height: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      margin-top: 16px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .progress-container.show {
      opacity: 1;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #fff;
      border-radius: 3px;
      transition: width 0ms linear;
    }

    .progress-text {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .progress-text.show {
      opacity: 1;
    }.card-graphic {width: 100%;
      height: 250px;
       background: url('images/Greta-transparent.png') center/cover no-repeat; }
.logo  { background: url('images/your-logo.png') center/contain no-repeat; }

    
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">Greta’s Café Bets</h1>
    <p class="subtitle">Grab a coffee, roll a die, and taste the sweet rewards.</p>
    <div class="card-graphic"></div>
    <div class="logo"></div>
  </div>

  <button class="play-btn breathe glow" id="playBtn">PLAY NOW</button>

  <!-- Progress bar under button -->
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-text" id="progressText">Loading 0%</div>

  <script>
    const btn = document.getElementById('playBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    btn.addEventListener('click', () => {
      // Ripple
      btn.classList.remove('ripple');
      void btn.offsetWidth;
      btn.classList.add('ripple');

      // Show progress UI
      progressContainer.classList.add('show');
      progressText.classList.add('show');

      // Reset
      progressBar.style.width = '0%';
      let percent = 0;
      progressText.textContent = 'Loading 0%';

      // Simulate loading (1% every 20ms → 100% in ~2 seconds)
      const interval = setInterval(() => {
        percent += 1;
        progressBar.style.width = percent + '%';
        progressText.textContent = `Loading ${percent}%`;

        if (percent >= 100) {
          clearInterval(interval);
          // Navigate after 100%
          setTimeout(() => {
            window.location.href = 'game.html'; // REPLACE WITH YOUR PAGE
          }, 300);
        }
      }, 20);

      // Disable button during load
      btn.disabled = true;
      btn.style.cursor = 'not-allowed';
    });

    // Pause animations on hover
    btn.addEventListener('mouseenter', () => btn.classList.remove('breathe','glow'));
    btn.addEventListener('mouseleave', () => {
      if (!btn.disabled) btn.classList.add('breathe','glow');
    });
  </script>
</body>
</html>
